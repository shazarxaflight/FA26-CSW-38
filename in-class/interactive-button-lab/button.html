<!DOCTYPE html>
<html lang="en">

<head>
  <style>
    #launchButton {
      border: none;
      border-radius: 30px;
      padding: 20px;
      background-color: blue;
      color: white;
      transition: all 1s;
    }

    #launchButton:hover {
      background-color: green;
      box-shadow: black 5px 5px 10px;
      transform: scale(0.9, 0.9);
    }
  </style>
</head>

<body>

<button id="launchButton">Launch Game</button>

</body>

</html>
