<!DOCTYPE html>
<html lang="en">

<head>
  <style>
    body {
      background-color: lavender;
    }
    
    #launchButton {
      border: none;
      border-radius: 30px;
      margin-left: auto;
      margin-top: 20%;
      margin-right: auto;
      padding: 20px;
      background-color: blue;
      color: white;
      font-size: 2em;
      transition: all 0.4s linear;
    }

    #launchButton:hover {
      background-color: green;
      box-shadow: black -5px -5px 2px;
      transform: scale(0.9, 0.9);
    }
  </style>
</head>

<body>

<button id="launchButton">Launch Game</button>

</body>

</html>
